[project]
name = "object-rel-nav"
version = "0.1.0"
description = "Object-Relative Navigation: ObjectReact [CoRL'25] | TANGO [ICRA'25] | RoboHop [ICRA'24]"
readme = "Readme.md"
requires-python = ">=3.9,<3.10"

dependencies = [
    # Core scientific stack
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "scikit-image",
    "numba",
    "sympy",

    # PyTorch ecosystem
    "torch",
    "torchvision",
    "transformers",
    "open-clip-torch",
    "einops",
    "timm",
    "kornia",
    "ultralytics",
    "efficientnet-pytorch",
    "faiss-gpu",
    "vit-pytorch",
    "diffusers",

    # Vision & image processing
    "opencv-python",
    "imageio",
    "imageio-ffmpeg",
    "pillow",

    # Robotics / navigation / geometry
    "habitat-lab",
    "networkx",
    "python-igraph",
    "pyvis",
    "pgmpy",
    "spatialmath-python",
    "utm",
    "numpy-quaternion",

    # Config & experiment management
    "hydra-core",
    "omegaconf",
    "pyyaml",
    "yacs",
    "tyro",
    "wandb",

    # Data & storage
    "h5py",
    "natsort",
    "polars",
    "lmdb",

    # Utilities
    "tqdm",
    "requests",
    "gdown",
    "kaggle",
    "ftfy",
    "prettytable",

    # Notebook / development
    "ipykernel",
    "ipython",
    "jupyter-client",

    # RL environment
    "gym==0.23.0",

    # Warmup scheduler
    "warmup-scheduler @ git+https://github.com/ildoonet/pytorch-gradual-warmup-lr.git",
]

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
